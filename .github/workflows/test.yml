name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew ktlintCheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21", "25"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check out esf-format
        uses: actions/checkout@v7
        with:
          repository: EVEShipFit/esf-format
          ref: v1.0
          path: esf-format

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build
        run: ./gradlew program

      - name: Run the test cases
        run: uv run --project esf-format/tools esf-test -- build/program

      - name: Run the unit tests
        run: ./gradlew test koverVerify koverLog --console=plain | tee coverage.txt

      - name: Report coverage
        run: |
          { echo '```'; grep 'coverage' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
